name: Actions Runner Diagnostic

on:
  push:
    branches:
      - diagnostics/actions-runner-probe-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-probe:
    name: Minimal public hosted runner probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner started
        run: echo "PUBLIC_RUNNER_PROBE_OK"
      - name: Confirm shell execution
        run: |
          printf 'UTC: '
          date -u
          printf 'PUBLIC_HOSTED_RUNNER_PROBE_COMPLETE\n'
